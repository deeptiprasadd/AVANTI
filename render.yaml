# Render Blueprint. Point Render at this repo and it reads this file, so
# the service is configured in version control rather than by clicking.
#
#   https://dashboard.render.com  ->  New  ->  Blueprint
#
# The free instance type spins down after 15 minutes without inbound
# traffic and takes about a minute to wake. A workspace gets 750 free
# instance hours a month and a month is roughly 730 hours, so pinging
# /api/health every ten minutes keeps one service awake continuously and
# still fits inside the allowance.

services:
  - type: web
    name: avanti
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile

    # Render restarts the service if this stops returning 2xx. It is a
    # cheap endpoint that touches no PDF machinery.
    healthCheckPath: /api/health

    autoDeploy: true

    envVars:
      # The free instance is a fraction of a CPU. Letting onnxruntime and
      # OpenBLAS each spin up a thread per core just thrashes.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"

      # OCR works but is the memory high-water mark: the app idles near
      # 270MB and a page bitmap plus the model's working set goes on top of
      # that. If the service gets OOM-killed while reading a scan, set this
      # to 0 -- scanned PDFs are then reported rather than read, and
      # everything else keeps working.
      - key: AVANTI_ENABLE_OCR
        value: "1"

      # Lower this to 110 to cut OCR memory and time further; measured
      # across 110/150/220 DPI the recovered text was the same.
      - key: AVANTI_OCR_DPI
        value: "150"

      # Set this in the Render dashboard, not here, so it stays out of the
      # repository. Without it the AI panel is simply hidden.
      - key: GEMINI_API_KEY
        sync: false

    # Render injects PORT (default 10000); the Dockerfile's CMD already
    # binds to ${PORT}, so nothing else is needed.
